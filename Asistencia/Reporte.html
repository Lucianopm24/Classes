<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia | Historial de Asistencia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #1e293b; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .row-present { border-left: 4px solid #10b981; }
        .row-late { border-left: 4px solid #f59e0b; }
        .row-absent { border-left: 4px solid #ef4444; }
        
        .tab-active { border-bottom: 2px solid #4f46e5; color: #4f46e5; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 px-6 py-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-emerald-600 text-white p-2 rounded-xl">
                    <i class="fas fa-history text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-none">Reportes<span class="text-emerald-600">Asistencia</span></h1>
                    <p class="text-[10px] uppercase tracking-tighter text-slate-400 font-bold">Consulta de registros</p>
                </div>
            </div>
            <div id="user-display" class="hidden md:flex items-center gap-3">
                <div class="text-right">
                    <p id="nav-username" class="text-sm font-bold text-slate-700"></p>
                    <p id="nav-role" class="text-[9px] uppercase font-black text-emerald-500 tracking-widest"></p>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 space-y-8">
        
        <header class="grid grid-cols-1 md:grid-cols-12 gap-6 bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
            <div class="md:col-span-4 space-y-2">
                <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Materia</label>
                <select id="filter-subject" onchange="fetchAttendanceRecords()" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-semibold outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                    <option value="">Todas las materias</option>
                </select>
            </div>
            <div class="md:col-span-4 space-y-2">
                <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Estudiante</label>
                <select id="filter-student" onchange="fetchAttendanceRecords()" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-semibold outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                    <option value="">Todos los estudiantes</option>
                </select>
            </div>
            <div class="md:col-span-4 flex items-end">
                <button onclick="fetchAttendanceRecords()" class="w-full py-4 bg-emerald-600 text-white rounded-2xl font-bold hover:bg-emerald-700 transition-all shadow-lg shadow-emerald-100">
                    <i class="fas fa-filter mr-2"></i> Filtrar Historial
                </button>
            </div>
        </header>

        <div id="stats-container" class="hidden grid grid-cols-1 sm:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold text-slate-400 uppercase">Clases Totales</p>
                    <h3 id="stat-total" class="text-3xl font-black text-slate-800">0</h3>
                </div>
                <div class="w-12 h-12 bg-slate-100 rounded-2xl flex items-center justify-center text-slate-400"><i class="fas fa-calendar-day text-xl"></i></div>
            </div>
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold text-slate-400 uppercase">Asistencia</p>
                    <h3 id="stat-percent" class="text-3xl font-black text-emerald-600">0%</h3>
                </div>
                <div class="w-12 h-12 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-500"><i class="fas fa-check-circle text-xl"></i></div>
            </div>
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold text-slate-400 uppercase">Inasistencias</p>
                    <h3 id="stat-absent" class="text-3xl font-black text-red-600">0</h3>
                </div>
                <div class="w-12 h-12 bg-red-50 rounded-2xl flex items-center justify-center text-red-500"><i class="fas fa-user-times text-xl"></i></div>
            </div>
        </div>

        <section class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-6 border-b border-slate-50 flex justify-between items-center">
                <h2 class="text-xl font-bold text-slate-800">Registros Encontrados</h2>
                <div id="loading-spinner" class="hidden"><i class="fas fa-circle-notch fa-spin text-emerald-500"></i></div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                            <th class="px-6 py-4">Fecha</th>
                            <th class="px-6 py-4">Estudiante</th>
                            <th class="px-6 py-4">Asignatura</th>
                            <th class="px-6 py-4">Estado</th>
                            <th class="px-6 py-4">Docente</th>
                        </tr>
                    </thead>
                    <tbody id="records-body" class="divide-y divide-slate-50">
                        <!-- Data will be injected here -->
                    </tbody>
                </table>
            </div>
            
            <!-- Empty State -->
            <div id="empty-results" class="py-20 text-center">
                <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-300">
                    <i class="fas fa-search"></i>
                </div>
                <p class="text-slate-400 font-medium">No hay registros para este criterio.</p>
            </div>
        </section>

    </main>

    <script>
        const API_BASE = "https://classes-backend.vercel.app";
        let state = {
            token: localStorage.getItem('gm_token'),
            allRecords: []
        };

        async function init() {
            if (!state.token) return;
            await fetchUser();
            await fetchFiltersData();
            await fetchAttendanceRecords(); // Carga inicial
        }

        async function fetchUser() {
            try {
                const res = await fetch(`${API_BASE}/api/me`, {
                    headers: { 'Authorization': `Bearer ${state.token}` }
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('user-display').classList.remove('hidden');
                    document.getElementById('nav-username').innerText = data.user.username;
                    document.getElementById('nav-role').innerText = data.user.role;
                }
            } catch (e) { console.error(e); }
        }

        async function fetchFiltersData() {
            try {
                const [studs, subs] = await Promise.all([
                    fetch(`${API_BASE}/api/classes/students`),
                    fetch(`${API_BASE}/api/classes/subjects`)
                ]);
                const students = await studs.json();
                const subjects = await subs.json();

                const studSelect = document.getElementById('filter-student');
                const subSelect = document.getElementById('filter-subject');

                students.forEach(s => studSelect.innerHTML += `<option value="${s.username}">${s.username}</option>`);
                subjects.forEach(s => subSelect.innerHTML += `<option value="${s.name}">${s.name}</option>`);
            } catch (e) { console.error(e); }
        }

        async function fetchAttendanceRecords() {
            const student = document.getElementById('filter-student').value;
            const subject = document.getElementById('filter-subject').value;
            const spinner = document.getElementById('loading-spinner');
            
            spinner.classList.remove('hidden');
            
            try {
                let url = `${API_BASE}/api/classes/attendance?`;
                if (student) url += `student=${student}&`;
                if (subject) url += `subject=${subject}`;

                const res = await fetch(url);
                state.allRecords = await res.json();
                
                renderTable();
                calculateStats();
            } catch (e) {
                console.error("Error cargando historial", e);
            } finally {
                spinner.classList.add('hidden');
            }
        }

        function renderTable() {
            const body = document.getElementById('records-body');
            const empty = document.getElementById('empty-results');
            body.innerHTML = "";

            if (state.allRecords.length === 0) {
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');

            const statusLabels = {
                'present': { label: 'Presente', class: 'bg-emerald-100 text-emerald-700', row: 'row-present' },
                'late': { label: 'Tarde', class: 'bg-amber-100 text-amber-700', row: 'row-late' },
                'absent': { label: 'Falla', class: 'bg-red-100 text-red-700', row: 'row-absent' }
            };

            state.allRecords.forEach(r => {
                const st = statusLabels[r.status] || { label: r.status, class: 'bg-slate-100', row: '' };
                const row = document.createElement('tr');
                row.className = `hover:bg-slate-50/50 transition-colors ${st.row}`;
                row.innerHTML = `
                    <td class="px-6 py-4 font-bold text-slate-600">${r.date}</td>
                    <td class="px-6 py-4 text-slate-800 font-semibold">${r.student}</td>
                    <td class="px-6 py-4 text-slate-500 text-sm">${r.subject}</td>
                    <td class="px-6 py-4">
                        <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider ${st.class}">
                            ${st.label}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-tighter">${r.teacher}</td>
                `;
                body.appendChild(row);
            });
        }

        function calculateStats() {
            const stats = document.getElementById('stats-container');
            if (state.allRecords.length === 0) {
                stats.classList.add('hidden');
                return;
            }

            stats.classList.remove('hidden');
            const total = state.allRecords.length;
            const presents = state.allRecords.filter(r => r.status === 'present').length;
            const lates = state.allRecords.filter(r => r.status === 'late').length;
            const absents = state.allRecords.filter(r => r.status === 'absent').length;

            // La asistencia efectiva se cuenta como Presente + Tarde
            const effectivePresence = presents + lates;
            const percent = ((effectivePresence / total) * 100).toFixed(0);

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-percent').innerText = `${percent}%`;
            document.getElementById('stat-absent').innerText = absents;
        }

        window.onload = init;
    </script>
</body>
</html>
