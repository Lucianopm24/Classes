<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podio de la Clase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #0f172a; color: #f8fafc; }
        .stat-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .gold-glow { box-shadow: 0 0 20px rgba(234, 179, 8, 0.3); border: 1px solid rgba(234, 179, 8, 0.5); }
        .rank-number { font-style: italic; font-weight: 800; }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="max-w-6xl mx-auto mb-12 flex flex-col md:flex-row justify-between items-end gap-6">
        <div>
            <span class="text-indigo-400 font-bold tracking-widest uppercase text-xs">Estadísticas Institucionales</span>
            <h1 class="text-4xl font-extrabold mt-2">Muro de <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-emerald-400">Excelencia</span></h1>
        </div>
        <button onclick="calculateEverything()" class="px-6 py-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl transition flex items-center gap-2">
            <i class="fas fa-sync-alt" id="refresh-icon"></i> Actualizar Ranking
        </button>
    </header>

    <main class="max-w-6xl mx-auto space-y-10">
        
        <!-- Top Players -->
        <section>
            <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                <i class="fas fa-trophy text-yellow-500"></i> Estudiantes Destacados
            </h2>
            <div id="top-students" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Skeleton Loading -->
                <div class="h-40 bg-white/5 rounded-3xl animate-pulse"></div>
                <div class="h-40 bg-white/5 rounded-3xl animate-pulse"></div>
                <div class="h-40 bg-white/5 rounded-3xl animate-pulse"></div>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
            <!-- Risk List -->
            <section class="stat-card p-8 rounded-3xl">
                <h2 class="text-xl font-bold mb-6 flex items-center gap-2 text-red-400">
                    <i class="fas fa-exclamation-triangle"></i> En Riesgo Académico
                </h2>
                <div id="risk-list" class="space-y-4">
                    <p class="text-slate-500 italic">Cargando datos...</p>
                </div>
            </section>

            <!-- Subject Performance -->
            <section class="stat-card p-8 rounded-3xl">
                <h2 class="text-xl font-bold mb-6 flex items-center gap-2 text-indigo-400">
                    <i class="fas fa-chart-pie"></i> Dificultad por Materia
                </h2>
                <div id="subject-stats" class="space-y-4">
                    <p class="text-slate-500 italic">Analizando promedios...</p>
                </div>
            </section>
        </div>
    </main>

    <script>
        const API_BASE = "https://classes-backend.vercel.app";

        async function calculateEverything() {
            const refreshIcon = document.getElementById('refresh-icon');
            refreshIcon.classList.add('fa-spin');

            try {
                // 1. Obtener datos base
                const [studentsRes, subjectsRes] = await Promise.all([
                    fetch(`${API_BASE}/api/classes/students`),
                    fetch(`${API_BASE}/api/classes/subjects`)
                ]);
                const students = await studentsRes.json();
                const subjects = await subjectsRes.json();

                let studentPerformance = [];
                let subjectScores = {};

                // 2. Procesar cada estudiante (Esto es pesado pero necesario para el Ranking)
                for (let student of students) {
                    let totalAverage = 0;
                    let count = 0;
                    let subjectDetails = [];

                    for (let subject of subjects) {
                        const res = await fetch(`${API_BASE}/api/classes/grades?student=${student.username}&subject=${subject.name}`);
                        const data = await res.json();
                        
                        if (data.grades && data.grades.length > 0) {
                            totalAverage += data.average;
                            count++;
                            subjectDetails.push({ name: subject.name, avg: data.average, passed: data.passed });
                            
                            // Track subject overall stats
                            if (!subjectScores[subject.name]) subjectScores[subject.name] = [];
                            subjectScores[subject.name].push(data.average);
                        }
                    }

                    if (count > 0) {
                        studentPerformance.push({
                            username: student.username,
                            globalAvg: (totalAverage / count).toFixed(2),
                            subjectsCount: count,
                            failing: subjectDetails.filter(s => !s.passed).length
                        });
                    }
                }

                renderRanking(studentPerformance);
                renderRisk(studentPerformance);
                renderSubjectStats(subjectScores);

            } catch (e) {
                console.error(e);
            } finally {
                refreshIcon.classList.remove('fa-spin');
            }
        }

        function renderRanking(data) {
            const sorted = data.sort((a, b) => b.globalAvg - a.globalAvg).slice(0, 3);
            const container = document.getElementById('top-students');
            container.innerHTML = "";

            const medals = ['text-yellow-400', 'text-slate-300', 'text-orange-400'];
            
            sorted.forEach((s, i) => {
                container.innerHTML += `
                    <div class="stat-card p-6 rounded-3xl ${i === 0 ? 'gold-glow' : ''} relative overflow-hidden group">
                        <div class="absolute -right-4 -bottom-4 text-white/5 text-8xl rank-number">${i+1}</div>
                        <div class="flex justify-between items-start mb-4">
                            <i class="fas fa-medal ${medals[i]} text-2xl"></i>
                            <span class="text-xs font-black px-2 py-1 bg-white/10 rounded-lg">#${i+1} RANK</span>
                        </div>
                        <h3 class="text-2xl font-black">${s.username}</h3>
                        <p class="text-indigo-400 font-bold text-3xl mt-2">${s.globalAvg} <span class="text-xs text-slate-500">Promedio</span></p>
                        <p class="text-[10px] uppercase tracking-widest mt-4 text-slate-400">${s.subjectsCount} Materias cursadas</p>
                    </div>
                `;
            });
        }

        function renderRisk(data) {
            const risk = data.filter(s => s.failing > 0 || s.globalAvg < 3.0)
                             .sort((a, b) => b.failing - a.failing);
            const container = document.getElementById('risk-list');
            container.innerHTML = risk.length ? "" : "<p class='text-emerald-400 text-sm'>No hay estudiantes en riesgo.</p>";

            risk.forEach(s => {
                container.innerHTML += `
                    <div class="flex items-center justify-between p-4 bg-red-500/5 rounded-2xl border border-red-500/10">
                        <div>
                            <p class="font-bold">${s.username}</p>
                            <p class="text-xs text-red-400">${s.failing} Materia(s) reprobada(s)</p>
                        </div>
                        <div class="text-right">
                            <p class="font-black text-lg">${s.globalAvg}</p>
                            <span class="text-[9px] uppercase font-bold text-slate-500">Global</span>
                        </div>
                    </div>
                `;
            });
        }

        function renderSubjectStats(scores) {
            const container = document.getElementById('subject-stats');
            container.innerHTML = "";

            Object.keys(scores).forEach(sub => {
                const avg = (scores[sub].reduce((a,b) => a+b, 0) / scores[sub].length).toFixed(2);
                container.innerHTML += `
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-bold mb-1 uppercase tracking-tighter">
                            <span>${sub}</span>
                            <span>Promedio Grupal: ${avg}</span>
                        </div>
                        <div class="w-full h-2 bg-white/5 rounded-full overflow-hidden">
                            <div class="h-full bg-indigo-500 rounded-full" style="width: ${avg * 20}%"></div>
                        </div>
                    </div>
                `;
            });
        }

        window.onload = calculateEverything;
    </script>
</body>
</html>
