<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GradeMaster | Gestión de Notas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); border: 1px solid rgba(226, 232, 240, 1); }
        .modal-active { display: flex !important; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .row-hover:hover { background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-800">

    <div id="app" class="min-h-screen flex flex-col">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-200">
                        <i class="fas fa-file-signature text-white"></i>
                    </div>
                    <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">Grade<span class="text-indigo-600">Admin</span></h1>
                </div>
                <div id="user-controls" class="hidden flex items-center gap-6">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold text-xs" id="user-initial">U</div>
                        <span id="username-display" class="text-sm font-semibold text-slate-600">Usuario</span>
                    </div>
                    <button onclick="handleLogout()" class="text-sm text-red-500 hover:text-red-700 font-bold transition">Salir</button>
                </div>
            </div>
        </header>

        <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-8">
            <section id="auth-view" class="max-w-md mx-auto mt-12">
                <div class="glass-card p-8 rounded-3xl shadow-2xl">
                    <div class="text-center mb-8">
                        <h2 class="text-2xl font-bold text-slate-900">Bienvenido al Gestor</h2>
                        <p class="text-slate-500 text-sm mt-2">Inicia sesión para gestionar las calificaciones</p>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Usuario</label>
                            <input type="text" id="login-username" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition" placeholder="Tu usuario">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Contraseña</label>
                            <input type="password" id="login-password" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition" placeholder="••••••••">
                        </div>
                        <button onclick="handleLogin()" id="login-btn" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-3 rounded-xl shadow-xl transition-all active:scale-[0.98]">
                            Entrar al Sistema
                        </button>
                    </div>
                </div>
            </section>

            <section id="dashboard-view" class="hidden space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                    <div class="md:col-span-4 glass-card p-6 rounded-2xl shadow-sm">
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Materia</label>
                        <select id="subject-filter" onchange="fetchGrades()" class="w-full p-3 bg-white rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer font-medium">
                            <option value="">Cargando...</option>
                        </select>
                    </div>
                    <div class="md:col-span-4 glass-card p-6 rounded-2xl shadow-sm">
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Estudiante</label>
                        <select id="student-filter" onchange="fetchGrades()" class="w-full p-3 bg-white rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer font-medium">
                            <option value="">Cargando...</option>
                        </select>
                    </div>
                    <div class="md:col-span-4 flex items-end">
                        <button onclick="openModal('add')" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg shadow-indigo-100 flex items-center justify-center gap-2 transition-all">
                            <i class="fas fa-plus-circle"></i> Agregar Calificación
                        </button>
                    </div>
                </div>

                <div id="stats-panel" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div class="glass-card p-6 rounded-2xl border-l-4 border-indigo-500 flex justify-between items-center">
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase">Promedio Final</p>
                            <h3 id="stat-avg" class="text-3xl font-black text-slate-900">0.0</h3>
                        </div>
                        <div class="bg-indigo-50 p-4 rounded-2xl text-indigo-600"><i class="fas fa-calculator text-2xl"></i></div>
                    </div>
                    <div id="stat-status-card" class="glass-card p-6 rounded-2xl border-l-4 flex justify-between items-center transition-colors">
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase">Estado Académico</p>
                            <h3 id="stat-status" class="text-xl font-bold">-</h3>
                        </div>
                        <div id="stat-status-icon" class="p-4 rounded-2xl"></div>
                    </div>
                </div>

                <div class="glass-card rounded-2xl shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50/50 text-slate-400 text-[10px] uppercase tracking-[0.15em] font-black border-b border-slate-100">
                                    <th class="px-6 py-4">Evaluación</th>
                                    <th class="px-6 py-4">Nota</th>
                                    <th class="px-6 py-4">Peso</th>
                                    <th class="px-6 py-4 text-right">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="grades-list" class="divide-y divide-slate-50">
                                <tr>
                                    <td colspan="4" class="px-6 py-20 text-center">
                                        <div class="flex flex-col items-center opacity-40">
                                            <i class="fas fa-layer-group text-4xl mb-4"></i>
                                            <p class="text-sm font-medium italic">Selecciona una materia y un estudiante</p>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="modal-container" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden overflow-y-auto max-h-screen">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 id="modal-label" class="text-lg font-bold text-slate-800">Editar Nota</h3>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-200 transition text-slate-400"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-8 space-y-5">
                <input type="hidden" id="grade-id">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Título de la Evaluación</label>
                    <input type="text" id="field-title" class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Parcial 1, Tarea, etc.">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Calificación (0-5)</label>
                        <input type="number" id="field-score" step="0.1" min="0" max="5" class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="4.5">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Peso (0-1.0)</label>
                        <input type="number" id="field-weight" step="0.01" min="0" max="1" class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="0.25">
                    </div>
                </div>
                <div class="p-4 bg-indigo-50 rounded-xl text-indigo-700 text-xs">
                    <p><strong>Nota:</strong> Un peso de 0.25 equivale al 25% de la nota final de la materia.</p>
                </div>
            </div>
            <div class="p-6 bg-slate-50 border-t border-slate-100 flex gap-3">
                <button onclick="closeModal()" class="flex-1 py-3 text-slate-500 font-bold hover:bg-slate-200 rounded-xl transition">Cancelar</button>
                <button onclick="submitGradeForm()" id="modal-submit" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition">Guardar</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 z-[100] translate-y-24 opacity-0 transition-all duration-300">
        <div class="bg-slate-900 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3">
            <div id="toast-icon"></div>
            <p id="toast-message" class="text-sm font-semibold"></p>
        </div>
    </div>

    <script>
        const API_BASE = "https://classes-backend.vercel.app";
        let state = {
            token: localStorage.getItem('gm_token'),
            user: null,
            currentSubjectId: "", // Cambiado a ID
            currentStudent: "",
            gradesList: []
        };

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toast-message');
            const icon = document.getElementById('toast-icon');
            
            msg.innerText = message;
            icon.innerHTML = isError ? '<i class="fas fa-times-circle text-red-400"></i>' : '<i class="fas fa-check-circle text-emerald-400"></i>';
            
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 3000);
        }

        async function handleLogin() {
            const user = document.getElementById('login-username').value;
            const pass = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');

            if (!user || !pass) return showToast("Faltan credenciales", true);

            btn.disabled = true;
            btn.innerText = "Verificando...";

            try {
                const response = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass, school_id: null }) // Enviando school_id null
                });
                const data = await response.json();

                if (data.success) {
                    state.token = data.token;
                    state.user = data.user;
                    localStorage.setItem('gm_token', data.token);
                    showToast(`Bienvenido ${data.user.username}`);
                    initDashboard();
                } else {
                    showToast(data.error || "Error de login", true);
                }
            } catch (err) {
                showToast("Error de conexión con el servidor", true);
            } finally {
                btn.disabled = false;
                btn.innerText = "Entrar al Sistema";
            }
        }

        function handleLogout() {
            localStorage.removeItem('gm_token');
            location.reload();
        }

        async function initDashboard() {
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            document.getElementById('user-controls').classList.remove('hidden');
            
            if (state.user) {
                document.getElementById('username-display').innerText = state.user.username;
                document.getElementById('user-initial').innerText = state.user.username[0].toUpperCase();
            }

            await Promise.all([fetchSubjects(), fetchStudents()]);
        }

        async function fetchSubjects() {
            try {
                const res = await fetch(`${API_BASE}/api/classes/subjects`, {
                    headers: { 'Authorization': `Bearer ${state.token}` } // Añadido Auth
                });
                const data = await res.json();
                const sel = document.getElementById('subject-filter');
                sel.innerHTML = '<option value="">Elige Materia</option>';
                data.forEach(s => {
                    sel.innerHTML += `<option value="${s.id}">${s.name}</option>`; // Usando s.id
                });
            } catch (e) { showToast("Error cargando materias", true); }
        }

        async function fetchStudents() {
            try {
                const res = await fetch(`${API_BASE}/api/classes/students`, {
                    headers: { 'Authorization': `Bearer ${state.token}` } // Añadido Auth
                });
                const data = await res.json();
                const sel = document.getElementById('student-filter');
                sel.innerHTML = '<option value="">Elige Estudiante</option>';
                data.forEach(s => {
                    sel.innerHTML += `<option value="${s.username}">${s.username}</option>`;
                });
            } catch (e) { showToast("Error cargando estudiantes", true); }
        }

        async function fetchGrades() {
            const subjectId = document.getElementById('subject-filter').value;
            const student = document.getElementById('student-filter').value;

            if (!subjectId || !student) {
                document.getElementById('stats-panel').classList.add('hidden');
                return;
            }

            state.currentSubjectId = subjectId;
            state.currentStudent = student;

            try {
                // Usando subject_id en vez de subject y añadiendo Auth
                const res = await fetch(`${API_BASE}/api/classes/grades?student=${student}&subject_id=${subjectId}`, {
                    headers: { 'Authorization': `Bearer ${state.token}` } 
                });
                const data = await res.json();
                renderGrades(data);
            } catch (e) { showToast("Error al obtener notas", true); }
        }

        function renderGrades(data) {
            const list = document.getElementById('grades-list');
            const stats = document.getElementById('stats-panel');
            
            list.innerHTML = "";
            stats.classList.remove('hidden');

            document.getElementById('stat-avg').innerText = data.average;
            const statusCard = document.getElementById('stat-status-card');
            const statusText = document.getElementById('stat-status');
            const statusIcon = document.getElementById('stat-status-icon');

            if (data.passed) {
                statusCard.className = "glass-card p-6 rounded-2xl border-l-4 border-emerald-500 flex justify-between items-center bg-emerald-50/10";
                statusText.innerText = "APROBADO";
                statusText.className = "text-xl font-black text-emerald-600";
                statusIcon.innerHTML = '<i class="fas fa-check-double text-2xl text-emerald-600"></i>';
            } else {
                statusCard.className = "glass-card p-6 rounded-2xl border-l-4 border-red-500 flex justify-between items-center bg-red-50/10";
                statusText.innerText = "REPROBADO";
                statusText.className = "text-xl font-black text-red-600";
                statusIcon.innerHTML = '<i class="fas fa-exclamation-triangle text-2xl text-red-600"></i>';
            }

            if (data.grades.length === 0) {
                list.innerHTML = `<tr><td colspan="4" class="px-6 py-12 text-center text-slate-400 italic">No hay registros</td></tr>`;
                return;
            }

            state.gradesList = data.grades;

            data.grades.forEach(grade => {
                list.innerHTML += `
                    <tr class="row-hover transition-colors group">
                        <td class="px-6 py-4 font-bold text-slate-700">${grade.title}</td>
                        <td class="px-6 py-4"><span class="px-3 py-1 bg-indigo-50 text-indigo-700 rounded-lg font-bold">${grade.score.toFixed(1)}</span></td>
                        <td class="px-6 py-4 text-slate-500 font-medium">${(grade.weight * 100).toFixed(0)}%</td>
                        <td class="px-6 py-4 text-right">
                            <div class="flex justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick='openModal("edit", ${JSON.stringify(grade).replace(/'/g, "&apos;")})' class="p-2 text-indigo-600 hover:bg-indigo-50 rounded-lg transition" title="Editar"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteGrade('${grade.id}')" class="p-2 text-red-500 hover:bg-red-50 rounded-lg transition" title="Borrar"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function openModal(mode, grade = null) {
            if (!state.currentSubjectId || !state.currentStudent) {
                return showToast("Selecciona primero Materia y Estudiante", true);
            }

            const container = document.getElementById('modal-container');
            const label = document.getElementById('modal-label');
            const submitBtn = document.getElementById('modal-submit');
            
            document.getElementById('grade-id').value = grade ? grade.id : "";
            document.getElementById('field-title').value = grade ? grade.title : "";
            document.getElementById('field-score').value = grade ? grade.score : "";
            document.getElementById('field-weight').value = grade ? grade.weight : "";

            label.innerText = mode === 'add' ? "Nueva Calificación" : "Editar Calificación";
            submitBtn.innerText = mode === 'add' ? "Crear Registro" : "Actualizar Datos";
            
            container.classList.add('modal-active');
        }

        function closeModal() {
            document.getElementById('modal-container').classList.remove('modal-active');
        }

        async function submitGradeForm() {
            const id = document.getElementById('grade-id').value;
            const payload = {
                title: document.getElementById('field-title').value,
                score: parseFloat(document.getElementById('field-score').value),
                weight: parseFloat(document.getElementById('field-weight').value),
                student: state.currentStudent,
                subject_id: state.currentSubjectId // Usando subject_id
            };

            if (!payload.title || isNaN(payload.score) || isNaN(payload.weight)) {
                return showToast("Revisa los campos", true);
            }

            const endpoint = id ? `${API_BASE}/api/classes/edit-grade` : `${API_BASE}/api/classes/add-grade`;
            if (id) payload.id = id;

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${state.token}`
                    },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    showToast(id ? "Nota actualizada" : "Nota creada");
                    closeModal();
                    fetchGrades();
                } else {
                    showToast(data.error || "Error en el servidor", true);
                }
            } catch (e) { showToast("Error de red", true); }
        }

        async function deleteGrade(id) {
            if (!confirm("¿Eliminar definitivamente esta nota?")) return;

            try {
                const res = await fetch(`${API_BASE}/api/classes/delete-grade`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${state.token}` // Añadido Auth
                    },
                    body: JSON.stringify({ id })
                });
                const data = await res.json();

                if (data.success) {
                    showToast("Nota eliminada");
                    fetchGrades();
                } else {
                    showToast(data.error || "Error al borrar", true);
                }
            } catch (e) { showToast("Error de red", true); }
        }

        window.onload = () => {
            if (state.token) {
                initDashboard();
            }
        };
    </script>
</body>
</html>
