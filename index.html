<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Wobe Classes | Elige tu colegio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    
    <style>
        :root {
            --ink:#0e0f12; --ink2:#1b1d24; --paper:#f4f1ea; --paper2:#ece8df;
            --muted:#8a8680; --lime:#b8f060; --line:#d8d3c8;
            --r:8px; --r-lg:14px;
            --mono:'DM Mono',monospace; --serif:'Fraunces',serif; --sans:'Outfit',sans-serif;
            --ease:cubic-bezier(.4,0,.2,1);
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh}
        
        /* Layout Auth */
        .auth-root{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
        .auth-left{background:var(--ink);color:var(--paper);padding:52px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
        .auth-left::after{content:'';position:absolute;width:460px;height:460px;border-radius:50%;border:80px solid rgba(184,240,96,.06);bottom:-160px;right:-160px;}
        .auth-right{background:var(--paper);display:flex;align-items:center;justify-content:center;padding:52px 40px}
        
        .wmark{display:flex;align-items:center;gap:11px}
        .wmark-icon{width:38px;height:38px;background:var(--lime);border-radius:9px;display:flex;align-items:center;justify-content:center}
        .wmark-text{font-family:var(--serif);font-size:17px;font-weight:500}
        
        .auth-hero h1{font-family:var(--serif);font-size:48px;font-weight:300;line-height:1.15;letter-spacing:-1.5px;color:var(--paper)}
        .auth-hero h1 em{font-style:italic;color:var(--lime)}
        
        .form-wrap{width:100%;max-width:380px}
        .form-wrap h2{font-family:var(--serif);font-size:30px;font-weight:500;letter-spacing:-.8px;margin-bottom:4px}
        .form-wrap .lead{font-size:14px;color:var(--muted);margin-bottom:30px}
        
        .field{margin-bottom:14px}
        .field label{display:block;font-size:11px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;font-family:var(--mono)}
        .field select{width:100%;background:var(--paper2);border:1.5px solid var(--line);border-radius:var(--r);color:var(--ink);font-family:var(--sans);font-size:14px;padding:10px 13px;outline:none;cursor:pointer;transition:all .18s}
        .field select:focus{border-color:var(--ink);background:#fff;box-shadow:0 0 0 3px rgba(14,15,18,.07)}
        
        .btn{display:inline-flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:14px;font-weight:600;border-radius:var(--r);border:none;cursor:pointer;padding:12px 16px;transition:all .18s var(--ease);width:100%;margin-top:10px}
        .btn-primary{background:var(--ink);color:var(--lime)}
        .btn-primary:hover{background:var(--ink2);transform:translateY(-1px);box-shadow:0 6px 20px rgba(14,15,18,.1)}

        @media(max-width:768px){
            .auth-root{grid-template-columns:1fr}
            .auth-left{display:none}
        }
    </style>
</head>
<body>

    <div class="auth-root">
        <!-- Sidebar Brand -->
        <div class="auth-left">
            <div class="wmark">
                <div class="wmark-icon">
                    <svg viewBox="0 0 20 20" fill="none" width="20" height="20">
                        <rect x="2" y="2" width="7" height="7" rx="2" fill="#0e0f12"/>
                        <rect x="11" y="2" width="7" height="7" rx="2" fill="#0e0f12"/>
                        <rect x="2" y="11" width="7" height="7" rx="2" fill="#0e0f12"/>
                        <rect x="11" y="11" width="7" height="7" rx="2" fill="#0e0f12" opacity=".35"/>
                    </svg>
                </div>
                <span class="wmark-text">Wobe Classes</span>
            </div>
            <div class="auth-hero">
                <h1>Selección de<br/><em>institución.</em></h1>
            </div>
        </div>

        <!-- Right Side Selector -->
        <div class="auth-right">
            <div class="form-wrap">
                <h2>¿A qué colegio vas?</h2>
                <p class="lead">Selecciona tu institución para continuar hacia el portal de clases.</p>
                
                <div class="field">
                    <label>Colegio</label>
                    <select id="schoolSelect">
                        <option value="" disabled selected>Selecciona una opción...</option>
                    </select>
                </div>
                
                <button class="btn btn-primary" onclick="handleRedirect()">Continuar</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN: Añade tus colegios aquí
        const schools = [
            { name: "Peluchelandia School", url: "https://classes.wobe.qzz.io/Peluchelandia-school" }
        ];

        const selectElement = document.getElementById('schoolSelect');

        // Poblar el selector
        schools.forEach(school => {
            const option = document.createElement('option');
            option.value = school.url;
            option.textContent = school.name;
            selectElement.appendChild(option);
        });

        // Manejar redirección
        function handleRedirect() {
            const selectedUrl = selectElement.value;
            if (selectedUrl) {
                window.location.href = selectedUrl;
            } else {
                // Pequeño feedback si no han seleccionado nada
                alert("Por favor, selecciona un colegio primero.");
            }
        }
    </script>
</body>
</html>
