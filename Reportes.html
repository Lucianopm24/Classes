<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wobe Classes | Reportes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fdfdfd; color: #1a1a1a; }
        .report-card { border-left-width: 6px; transition: transform 0.2s; }
        .report-card:hover { transform: translateX(5px); }
        .severity-merit { border-left-color: #eab308; background: #fefce8; }
        .severity-low { border-left-color: #3b82f6; background: #eff6ff; }
        .severity-medium { border-left-color: #f97316; background: #fff7ed; }
        .severity-high { border-left-color: #ef4444; background: #fef2f2; }
        .glass-header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid #eee; }
    </style>
</head>
<body class="bg-slate-50">

    <nav class="glass-header sticky top-0 z-50 px-6 py-4">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-slate-900 text-white p-2 rounded-xl">
                    <i class="fas fa-shield-halved text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-none">Observador<span class="text-indigo-600">Pro</span></h1>
                    <p class="text-[10px] uppercase tracking-tighter text-slate-400 font-bold">Control Disciplinario</p>
                </div>
            </div>
            <div id="user-info" class="text-right"></div>
        </div>
    </nav>

    <main id="main-content" class="max-w-5xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 opacity-0 transition-opacity duration-500">
        <div id="unauthorized-message" class="hidden col-span-12 py-12 flex justify-center">
            <div class="w-full max-w-md bg-white p-8 rounded-[2rem] border border-slate-200 shadow-2xl">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-black text-slate-800">Acceso Restringido</h2>
                </div>
                <div class="space-y-4">
                    <input type="text" id="login-user" class="w-full p-4 bg-slate-50 border rounded-2xl" placeholder="Usuario">
                    <input type="password" id="login-pass" class="w-full p-4 bg-slate-50 border rounded-2xl" placeholder="Contraseña">
                    <button onclick="handleLogin()" id="btn-login" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold">Iniciar Sesión</button>
                </div>
            </div>
        </div>

        <aside id="sidebar-content" class="hidden lg:col-span-4 space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <h3 class="text-lg font-black mb-6"><i class="fas fa-user-graduate text-indigo-500 mr-2"></i> Estudiante</h3>
                <select id="student-select" onchange="loadStudentReport()" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold"></select>
            </div>
            <div id="form-container" class="hidden bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <h3 class="text-lg font-black mb-6"><i class="fas fa-pen-nib text-indigo-500 mr-2"></i> Nuevo Registro</h3>
                <div class="space-y-4">
                    <select id="rep-type" class="w-full p-3 bg-slate-50 border rounded-xl text-sm"><option value="disciplina">Disciplina</option><option value="academico">Académico</option></select>
                    <select id="rep-severity" class="w-full p-3 bg-slate-50 border rounded-xl text-sm"><option value="merit">Mérito</option><option value="low">Leve</option><option value="medium">Grave</option><option value="high">Rectoría</option></select>
                    <textarea id="rep-desc" rows="4" class="w-full p-3 bg-slate-50 border rounded-xl text-sm" placeholder="Detalle..."></textarea>
                    <button onclick="createReport()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold">Registrar</button>
                </div>
            </div>
        </aside>

        <section id="reports-section" class="hidden lg:col-span-8 space-y-6">
            <h2 class="text-2xl font-black text-slate-800">Historial: <span id="display-name"></span></h2>
            <div id="reports-timeline" class="space-y-4"></div>
        </section>
    </main>

    <div id="toast" class="fixed bottom-6 right-6 translate-y-24 opacity-0 transition-all duration-300">
        <div id="toast-body" class="bg-slate-900 text-white px-6 py-4 rounded-2xl shadow-2xl"><p id="toast-msg"></p></div>
    </div>

    <script>
        const API_BASE = "https://classes-backend.vercel.app";
        let state = { token: localStorage.getItem('gm_token'), selectedStudent: "" };

        async function init() {
            if (!state.token) return showView('unauthorized');
            const res = await fetch(`${API_BASE}/api/me`, { headers: { 'Authorization': `Bearer ${state.token}` }});
            const data = await res.json();
            if (data.success) {
                document.getElementById('user-info').innerHTML = `<p class="font-black">${data.user.username}</p>`;
                showView('authorized');
                fetchStudents();
            } else { showView('unauthorized'); }
        }

        async function handleLogin() {
            const res = await fetch(`${API_BASE}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: document.getElementById('login-user').value, password: document.getElementById('login-pass').value })
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('gm_token', data.token);
                state.token = data.token;
                location.reload();
            } else { notify("Error de acceso", true); }
        }

        async function fetchStudents() {
            const res = await fetch(`${API_BASE}/api/classes/students`, { headers: { 'Authorization': `Bearer ${state.token}` }});
            const students = await res.json();
            const select = document.getElementById('student-select');
            students.forEach(s => select.innerHTML += `<option value="${s.username}">${s.username}</option>`);
        }

        async function loadStudentReport() {
            const student = document.getElementById('student-select').value;
            state.selectedStudent = student;
            document.getElementById('display-name').innerText = student;
            document.getElementById('form-container').classList.remove('hidden');
            const res = await fetch(`${API_BASE}/api/classes/reports?student=${student}`, { headers: { 'Authorization': `Bearer ${state.token}` }});
            const reports = await res.json();
            const container = document.getElementById('reports-timeline');
            container.innerHTML = reports.map(r => `
                <div class="report-card p-6 rounded-2xl shadow-sm border severity-${r.severity}">
                    <div class="flex justify-between font-bold"><h4>${r.type}</h4><span>${r.date}</span></div>
                    <p class="text-sm mt-2">${r.description}</p>
                    <button onclick="deleteReport('${r.id}')" class="text-red-500 text-xs mt-4">Eliminar</button>
                </div>
            `).join('');
        }

        async function createReport() {
            const res = await fetch(`${API_BASE}/api/classes/reports`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.token}` },
                body: JSON.stringify({ 
                    student: state.selectedStudent, 
                    type: document.getElementById('rep-type').value, 
                    severity: document.getElementById('rep-severity').value, 
                    description: document.getElementById('rep-desc').value 
                })
            });
            if ((await res.json()).success) { notify("Guardado"); loadStudentReport(); }
        }

        async function deleteReport(id) {
            await fetch(`${API_BASE}/api/classes/delete-report`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.token}` },
                body: JSON.stringify({ id })
            });
            loadStudentReport();
        }

        function showView(type) {
            document.getElementById('main-content').classList.remove('opacity-0');
            if (type === 'unauthorized') document.getElementById('unauthorized-message').classList.remove('hidden');
            else { document.getElementById('sidebar-content').classList.remove('hidden'); document.getElementById('reports-section').classList.remove('hidden'); }
        }

        function notify(msg, isErr) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-24', 'opacity-0'), 2000);
        }

        window.onload = init;
    </script>
</body>
</html>
