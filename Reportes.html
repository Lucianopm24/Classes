<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia | Observador Disciplinario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fdfdfd; color: #1a1a1a; }
        .report-card { border-left-width: 6px; transition: transform 0.2s; }
        .report-card:hover { transform: translateX(5px); }
        .severity-merit { border-left-color: #eab308; background: #fefce8; }
        .severity-low { border-left-color: #3b82f6; background: #eff6ff; }
        .severity-medium { border-left-color: #f97316; background: #fff7ed; }
        .severity-high { border-left-color: #ef4444; background: #fef2f2; }
        .glass-header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid #eee; }
    </style>
</head>
<body class="bg-slate-50">

    <nav class="glass-header sticky top-0 z-50 px-6 py-4">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-slate-900 text-white p-2 rounded-xl">
                    <i class="fas fa-shield-halved text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-none">Observador<span class="text-indigo-600">Pro</span></h1>
                    <p class="text-[10px] uppercase tracking-tighter text-slate-400 font-bold">Control Disciplinario</p>
                </div>
            </div>
            <div id="user-info" class="text-right">
                <!-- User profile info -->
            </div>
        </div>
    </nav>

    <main id="main-content" class="max-w-5xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 opacity-0 transition-opacity duration-500">
        
        <!-- Login / Unauthorized View -->
        <div id="unauthorized-message" class="hidden col-span-12 py-12 flex justify-center">
            <div class="w-full max-w-md bg-white p-8 rounded-[2rem] border border-slate-200 shadow-2xl">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-6 text-2xl">
                    <i class="fas fa-fingerprint"></i>
                </div>
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-black text-slate-800">Acceso Restringido</h2>
                    <p class="text-slate-500 mt-2 text-sm">Ingresa tus credenciales de docente para gestionar el observador.</p>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1">Usuario</label>
                        <input type="text" id="login-user" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none font-semibold transition-all" placeholder="Nombre de usuario">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1">Contraseña</label>
                        <input type="password" id="login-pass" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none font-semibold transition-all" placeholder="••••••••">
                    </div>
                    <button onclick="handleLogin()" id="btn-login" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-indigo-600 transition-all shadow-lg active:scale-[0.98] flex items-center justify-center gap-2">
                        <span>Iniciar Sesión</span>
                        <i class="fas fa-arrow-right text-xs"></i>
                    </button>
                </div>
                
                <p class="mt-8 text-center text-[10px] text-slate-400 font-bold uppercase tracking-widest">Sistema de Control Disciplinario v2.0</p>
            </div>
        </div>

        <!-- Sidebar: Student Selection and Form -->
        <aside id="sidebar-content" class="lg:col-span-4 space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <h3 class="text-lg font-black text-slate-800 mb-6 flex items-center gap-2">
                    <i class="fas fa-user-graduate text-indigo-500"></i> Estudiante
                </h3>
                <div class="space-y-4">
                    <select id="student-select" onchange="loadStudentReport()" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="">Seleccionar alumno...</option>
                    </select>
                </div>
            </div>

            <div id="form-container" class="hidden bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <h3 class="text-lg font-black text-slate-800 mb-6 flex items-center gap-2">
                    <i class="fas fa-pen-nib text-indigo-500"></i> Nuevo Registro
                </h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Tipo de Registro</label>
                        <select id="rep-type" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold">
                            <option value="disciplina">Disciplina / Comportamiento</option>
                            <option value="academico">Rendimiento Académico</option>
                            <option value="convivencia">Convivencia Escolar</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Gravedad / Nivel</label>
                        <select id="rep-severity" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold">
                            <option value="merit">⭐ Mérito / Elogio</option>
                            <option value="low">🔹 Falta Leve</option>
                            <option value="medium">🔸 Falta Grave</option>
                            <option value="high">🚨 Rectoría / Expulsión</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Descripción</label>
                        <textarea id="rep-desc" rows="4" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Detalla lo sucedido..."></textarea>
                    </div>
                    <button onclick="createReport()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-black transition-all shadow-lg active:scale-95">
                        Registrar en Hoja de Vida
                    </button>
                </div>
            </div>
        </aside>

        <section id="reports-section" class="lg:col-span-8 space-y-6">
            <div class="flex justify-between items-end">
                <h2 class="text-2xl font-black text-slate-800">Historial de <span id="display-name" class="text-indigo-600">Usuario</span></h2>
                <span id="report-count" class="px-3 py-1 bg-slate-200 text-slate-600 rounded-full text-xs font-bold">0 Registros</span>
            </div>

            <div id="reports-timeline" class="space-y-4">
                <div class="p-20 text-center bg-white rounded-3xl border-2 border-dashed border-slate-200">
                    <i class="fas fa-folder-open text-4xl text-slate-200 mb-4"></i>
                    <p class="text-slate-400 font-medium italic">Selecciona un estudiante para cargar sus antecedentes.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 translate-y-24 opacity-0 transition-all duration-300 z-[100]">
        <div id="toast-body" class="bg-slate-900 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3">
            <p id="toast-msg" class="text-sm font-bold"></p>
        </div>
    </div>

    <script>
        const API_BASE = "https://classes-backend.vercel.app";
        let state = {
            token: localStorage.getItem('gm_token'),
            currentUser: null,
            selectedStudent: ""
        };

        async function init() {
            if (!state.token) {
                showUnauthorized();
                return;
            }
            
            try {
                const authSuccess = await fetchMe();
                if (authSuccess) {
                    await fetchStudents();
                    showAuthorized();
                } else {
                    showUnauthorized();
                }
            } catch (err) {
                showUnauthorized();
            }
        }

        async function handleLogin() {
            const user = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            const btn = document.getElementById('btn-login');

            if (!user || !pass) return notify("Completa todos los campos", true);

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Autenticando...';

            try {
                const res = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('gm_token', data.token);
                    state.token = data.token;
                    notify("Sesión iniciada correctamente");
                    await init(); // Recargar el estado de la app
                } else {
                    notify(data.error || "Credenciales incorrectas", true);
                }
            } catch (e) {
                notify("Error de conexión con el servidor", true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Iniciar Sesión</span><i class="fas fa-arrow-right text-xs"></i>';
            }
        }

        function showUnauthorized() {
            const main = document.getElementById('main-content');
            document.getElementById('unauthorized-message').classList.remove('hidden');
            document.getElementById('sidebar-content').classList.add('hidden');
            document.getElementById('reports-section').classList.add('hidden');
            main.classList.remove('opacity-0');
            main.classList.add('opacity-100');
        }

        function showAuthorized() {
            const main = document.getElementById('main-content');
            document.getElementById('unauthorized-message').classList.add('hidden');
            document.getElementById('sidebar-content').classList.remove('hidden');
            document.getElementById('reports-section').classList.remove('hidden');
            main.classList.remove('opacity-0');
            main.classList.add('opacity-100');
        }

        async function fetchMe() {
            try {
                const res = await fetch(`${API_BASE}/api/me`, {
                    headers: { 'Authorization': `Bearer ${state.token}` }
                });
                const data = await res.json();
                if (data.success) {
                    state.currentUser = data.user;
                    document.getElementById('user-info').innerHTML = `
                        <p class="text-sm font-black text-slate-800">${data.user.username}</p>
                        <p class="text-[10px] font-bold text-indigo-500 uppercase">${data.user.role}</p>
                    `;
                    return true;
                }
                return false;
            } catch (e) { return false; }
        }

        async function fetchStudents() {
            try {
                const res = await fetch(`${API_BASE}/api/classes/students`);
                const students = await res.json();
                const select = document.getElementById('student-select');
                select.innerHTML = '<option value="">Seleccionar alumno...</option>';
                students.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.username;
                    opt.textContent = s.username;
                    select.appendChild(opt);
                });
            } catch (e) { console.error("Error cargando estudiantes", e); }
        }

        async function loadStudentReport() {
            const student = document.getElementById('student-select').value;
            if (!student) {
                document.getElementById('form-container').classList.add('hidden');
                return;
            }

            state.selectedStudent = student;
            document.getElementById('display-name').innerText = student;
            document.getElementById('form-container').classList.remove('hidden');

            try {
                const res = await fetch(`${API_BASE}/api/classes/reports?student=${student}`);
                const reports = await res.json();
                renderReports(reports);
            } catch (e) { notify("Error al cargar historial", true); }
        }

        function renderReports(reports) {
            const container = document.getElementById('reports-timeline');
            document.getElementById('report-count').innerText = `${reports.length} Registros`;

            if (reports.length === 0) {
                container.innerHTML = `
                    <div class="p-20 text-center bg-white rounded-3xl border border-slate-100">
                        <p class="text-slate-400 font-medium italic">Sin anotaciones en la hoja de vida.</p>
                    </div>`;
                return;
            }

            const severityLabels = { merit: "Mérito", low: "Falta Leve", medium: "Falta Grave", high: "Grave (Rectoría)" };

            container.innerHTML = reports.map(r => `
                <div class="report-card p-6 rounded-2xl shadow-sm border border-slate-100 severity-${r.severity}">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="text-[10px] font-black uppercase tracking-widest text-slate-400">${r.type}</span>
                            <h4 class="font-bold text-slate-800">${severityLabels[r.severity] || r.severity}</h4>
                        </div>
                        <span class="text-[10px] font-bold text-slate-400">${r.date}</span>
                    </div>
                    <p class="text-sm text-slate-600 leading-relaxed mb-4">${r.description}</p>
                    <div class="flex justify-between items-center pt-4 border-t border-slate-100/50">
                        <span class="text-xs font-semibold text-slate-400"><i class="fas fa-user-tie mr-1"></i> ${r.officer}</span>
                        <button onclick="deleteReport('${r.id}')" class="text-slate-300 hover:text-red-500 transition"><i class="fas fa-trash-alt text-xs"></i></button>
                    </div>
                </div>
            `).join('');
        }

        async function createReport() {
            const desc = document.getElementById('rep-desc').value;
            if (!desc) return notify("Escribe una descripción", true);

            const payload = {
                student: state.selectedStudent,
                type: document.getElementById('rep-type').value,
                severity: document.getElementById('rep-severity').value,
                description: desc,
                date: new Date().toISOString().split('T')[0]
            };

            try {
                const res = await fetch(`${API_BASE}/api/classes/reports`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${state.token}`
                    },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    notify("Anotación registrada correctamente");
                    document.getElementById('rep-desc').value = "";
                    loadStudentReport();
                }
            } catch (e) { notify("Error al registrar", true); }
        }

        async function deleteReport(id) {
            if (!confirm("¿Seguro que deseas eliminar esta anotación?")) return;

            try {
                const res = await fetch(`${API_BASE}/api/classes/delete-report`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                const data = await res.json();
                if (data.success) {
                    notify("Registro eliminado");
                    loadStudentReport();
                }
            } catch (e) { notify("Error al borrar", true); }
        }

        function notify(msg, isError = false) {
            const toast = document.getElementById('toast');
            const body = document.getElementById('toast-body');
            document.getElementById('toast-msg').innerText = msg;
            body.className = isError ? "bg-red-600 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3" : "bg-slate-900 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3";
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 3000);
        }

        window.onload = init;
    </script>
</body>
</html>
